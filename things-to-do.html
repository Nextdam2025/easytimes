<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Easy Times • Things to Do</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600&display=swap" rel="stylesheet"/>

  <style>
    :root{--bg:#12100c;--panel:#17130d;--gold:#d9b65d;--cream:#f5ead8;--orange:#ec7623;--muted:#b8ab94;}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100vh;width:100vw;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Barlow Condensed',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(circle at 75% 0,rgba(217,182,93,.16),transparent 34%),linear-gradient(105deg,#0c0b08 0%,#17120b 58%,#2b2112 100%)}
    video.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.13;z-index:-1}.orange-frame{position:fixed;inset:28px;border:3px solid var(--gold);border-radius:28px;pointer-events:none;z-index:10000}.orange-frame:after{content:"";position:absolute;inset:16px;border:1px solid rgba(217,182,93,.18);border-radius:20px}
    .logo{animation:none;margin:1.15rem 0 .7rem}.logo h1{font-size:clamp(3.4rem,6vw,6.6rem);letter-spacing:.08em;line-height:.82;color:var(--cream)}.logo h2{font-size:clamp(1.25rem,2.3vw,2.4rem);color:var(--gold);margin-top:.2em;letter-spacing:.07em;text-transform:uppercase}.logo:after{content:"";display:block;width:min(380px,44vw);height:5px;background:var(--orange);border-radius:999px;margin:15px auto 0}.back-btn{margin:1rem 0 .2rem}.back-btn button{padding:10px 20px;font-size:1rem;border-radius:999px;background:rgba(245,234,216,.08);border:1px solid rgba(217,182,93,.65);color:var(--cream);cursor:pointer;font-weight:900;text-transform:uppercase}.back-btn button:hover{background:var(--orange);color:#111;border-color:var(--orange)}
    .partners-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;width:100%;max-width:1200px;padding:0 1.3rem 2rem;overflow-y:auto;flex:1}.partner-card{background:linear-gradient(145deg,rgba(18,16,12,.96),rgba(34,25,13,.96));border:1.8px solid rgba(217,182,93,.78);border-radius:20px;padding:1rem;display:flex;flex-direction:column;align-items:center;transition:.2s;cursor:pointer;min-height:290px;box-shadow:0 14px 34px rgba(0,0,0,.28)}.partner-card:hover{transform:translateY(-3px);border-color:var(--orange)}.partner-card img{width:120px;height:120px;object-fit:contain;background:rgba(245,234,216,.06);border:1px solid rgba(217,182,93,.28);border-radius:16px;padding:10px;margin-bottom:.75rem}.partner-card h3{font-size:1.65rem;margin-bottom:.45rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}.partner-card p{font-family:Arial,sans-serif;font-size:1rem;line-height:1.4;color:#eadfcc;margin-bottom:1rem}.partner-action{margin-top:auto;width:100%;padding:.75rem;border:none;border-radius:999px;background:var(--orange);color:#111;font-weight:900;font-size:1rem;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
    .partner-popup{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20000;display:none;align-items:center;justify-content:center;padding:30px}.partner-box{width:95vw;max-width:920px;height:88vh;background:#111;border:3px solid var(--gold);border-radius:24px;box-shadow:0 0 60px rgba(0,0,0,.8);overflow:hidden;display:flex;flex-direction:column}.partner-header{height:64px;min-height:64px;background:#15110b;border-bottom:1px solid rgba(217,182,93,.6);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.partner-header h3{font-size:1.5rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}.partner-header button{padding:10px 18px;background:var(--orange);color:#111;border:none;border-radius:999px;font-weight:900;cursor:pointer}.partner-iframe{width:100%;height:100%;border:none;background:#000}
  </style>
</head>

<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="smoke.mp4" type="video/mp4"/>
  </video>

  <div class="orange-frame"></div>

  <div class="back-btn">
    <button onclick="history.back()">⬅ Back</button>
  </div>

  <div class="logo">
    <h1>EASY TIMES</h1>
    <h2>Things To Do In Amsterdam</h2>
  </div>

  <div class="partners-grid" id="partnersGrid"></div>

  <div class="partner-popup" id="partnerPopup">
    <div class="partner-box">
      <div class="partner-header">
        <h3 id="popupTitle">Partner</h3>
        <button onclick="closePartnerPopup()">Close</button>
      </div>

      <div class="partner-content" id="partnerIntro">
        <img id="popupLogo" src="" alt="">
        <p id="popupText"></p>
        <button class="open-site-btn" onclick="openPartnerPage()">View Inside EasyTimes</button>
      </div>

      <iframe id="partnerFrame" src="about:blank" title="EasyTimes partner page"></iframe>
    </div>
  </div>

<script>
const partners = [
  {
    id:"abike",
    name:"A-Bike Rentals",
    logo:"images/abike.png",
    text:"Discover Amsterdam by bike. One of the best ways to explore the city.",
    page:"partner-abike.html"
  },
  {
    id:"hashmuseum",
    name:"Hash & Marijuana Museum",
    logo:"images/hash-museum.png",
    text:"Learn about the fascinating history of cannabis culture.",
    page:"partner-hashmuseum.html"
  },
  {
    id:"canal",
    name:"Canal Cruise",
    logo:"images/canal-cruise.png",
    text:"Experience Amsterdam from the water with a classic canal cruise.",
    page:"partner-canal.html"
  },
  {
    id:"heineken",
    name:"Heineken Experience",
    logo:"images/heineken.png",
    text:"Visit one of Amsterdam’s most famous attractions.",
    page:"partner-heineken.html"
  },
  {
    id:"rijksmuseum",
    name:"Rijksmuseum",
    logo:"images/rijksmuseum.png",
    text:"See masterpieces from Dutch history and art.",
    page:"partner-rijksmuseum.html"
  },
  {
    id:"annefrank",
    name:"Anne Frank House",
    logo:"images/annefrank.png",
    text:"A powerful historical experience in Amsterdam.",
    page:"partner-annefrank.html"
  }
];

let activePartner = null;
const grid = document.getElementById("partnersGrid");

partners.forEach(partner => {
  const card = document.createElement("div");
  card.className = "partner-card";
  card.innerHTML = `
    <img src="${partner.logo}" alt="${partner.name}">
    <h3>${partner.name}</h3>
    <p>${partner.text}</p>
    <button class="partner-action" type="button">View Details</button>
  `;

  card.onclick = () => openPartnerPopup(partner);
  grid.appendChild(card);
});

function openPartnerPopup(partner){
  activePartner = partner;

  document.getElementById("popupTitle").innerText = partner.name;
  document.getElementById("popupLogo").src = partner.logo;
  document.getElementById("popupLogo").alt = partner.name;
  document.getElementById("popupText").innerText = partner.text;

  document.getElementById("partnerIntro").style.display = "flex";
  document.getElementById("partnerFrame").style.display = "none";
  document.getElementById("partnerFrame").src = "about:blank";

  document.getElementById("partnerPopup").style.display = "flex";
}

function closePartnerPopup(){
  document.getElementById("partnerPopup").style.display = "none";
  document.getElementById("partnerFrame").src = "about:blank";
  activePartner = null;
}

function openPartnerPage(){
  if(!activePartner) return;

  document.getElementById("partnerIntro").style.display = "none";
  document.getElementById("partnerFrame").style.display = "block";
  document.getElementById("partnerFrame").src = activePartner.page;
}
</script>
</body>
</html>
