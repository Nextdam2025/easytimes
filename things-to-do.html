<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Easy Times • Things to Do</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#12100c;
      --panel:#17130d;
      --gold:#d9b65d;
      --cream:#f5ead8;
      --orange:#ec7623;
      --muted:#b8ab94;
      --safe:clamp(14px,2.2vw,34px);
      --frame:clamp(12px,2.2vw,34px);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--cream);
      font-family:'Inter',Arial,sans-serif;
      touch-action:manipulation;
    }
    body{
      min-height:100dvh;
      overflow:hidden;
      padding:var(--safe);
      background:
        radial-gradient(circle at 75% 8%,rgba(217,182,93,.18),transparent 32%),
        radial-gradient(circle at 16% 90%,rgba(236,118,35,.16),transparent 34%),
        linear-gradient(112deg,#0c0b08 0%,#17120b 58%,#2b2112 100%);
      text-align:center;
    }
    video.bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.14;
      z-index:0;
      filter:contrast(1.1);
    }
    .frame{
      position:fixed;
      inset:var(--frame);
      border:3px solid var(--gold);
      border-radius:clamp(22px,3vw,36px);
      pointer-events:none;
      z-index:5;
      box-shadow:inset 0 0 0 1px rgba(217,182,93,.16),0 0 54px rgba(0,0,0,.32);
    }
    .frame:after{
      content:"";
      position:absolute;
      inset:clamp(10px,1.4vw,18px);
      border:1px solid rgba(217,182,93,.18);
      border-radius:clamp(15px,2vw,25px);
    }
    .page{
      position:relative;
      z-index:2;
      height:calc(100dvh - (var(--safe) * 2));
      max-width:1440px;
      margin:0 auto;
      padding:clamp(18px,2.4vw,34px);
      display:grid;
      grid-template-rows:auto 1fr;
      gap:clamp(14px,2vh,28px);
      min-height:0;
    }
    .topbar{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:clamp(14px,2vw,28px);
      min-height:0;
    }
    .back{
      border:1px solid rgba(217,182,93,.62);
      background:rgba(245,234,216,.09);
      color:var(--cream);
      border-radius:999px;
      padding:clamp(12px,1.2vw,17px) clamp(18px,1.8vw,28px);
      font-size:clamp(.95rem,1.15vw,1.2rem);
      font-weight:900;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .back:hover,.back:focus{background:var(--orange);color:#111;border-color:var(--orange);outline:none;}
    .brand{
      min-width:0;
      text-align:center;
    }
    .brand h1{
      font-family:'Barlow Condensed',Arial,sans-serif;
      font-size:clamp(4.4rem,8.4vw,8.8rem);
      line-height:.78;
      letter-spacing:.055em;
      color:var(--cream);
      text-transform:uppercase;
      text-shadow:0 10px 28px rgba(0,0,0,.38);
    }
    .brand h2{
      font-family:'Barlow Condensed',Arial,sans-serif;
      font-size:clamp(1.55rem,3vw,3rem);
      line-height:.92;
      color:var(--gold);
      letter-spacing:.075em;
      text-transform:uppercase;
      margin-top:8px;
    }
    .brand .line{
      width:min(560px,56vw);
      height:5px;
      background:var(--orange);
      border-radius:999px;
      margin:clamp(10px,1.4vw,18px) auto 0;
    }
    .hint{
      justify-self:end;
      align-self:center;
      font-family:'Barlow Condensed',Arial,sans-serif;
      font-size:clamp(1.35rem,2.4vw,2.65rem);
      line-height:.9;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      background:linear-gradient(90deg,#ffd755,var(--orange));
      color:#111;
      padding:clamp(11px,1vw,16px) clamp(16px,1.7vw,28px);
      border-radius:999px;
      white-space:nowrap;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
    }
    .partners-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      grid-template-rows:repeat(2,minmax(0,1fr));
      gap:clamp(14px,1.6vw,24px);
      width:100%;
      height:100%;
      min-height:0;
      overflow:hidden;
    }
    .partner-card{
      min-width:0;
      min-height:0;
      height:100%;
      background:linear-gradient(145deg,rgba(18,16,12,.98),rgba(38,27,12,.98));
      border:2px solid rgba(217,182,93,.86);
      border-radius:clamp(20px,2vw,28px);
      display:grid;
      grid-template-rows:auto 1fr;
      cursor:pointer;
      transition:transform .18s ease,border-color .18s ease,background .18s ease;
      box-shadow:0 16px 42px rgba(0,0,0,.32);
      overflow:hidden;
    }
    .partner-card:hover,.partner-card:focus-within{
      transform:translateY(-3px);
      border-color:var(--orange);
    }
    .card-media{
      position:relative;
      height:clamp(78px,13vh,150px);
      background:rgba(0,0,0,.35);
      border-bottom:1px solid rgba(217,182,93,.35);
      overflow:hidden;
    }
    .card-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .card-icon{
      position:absolute;
      left:clamp(10px,1.2vw,16px);
      bottom:clamp(-14px,-1.6vw,-18px);
      width:clamp(36px,3.6vw,52px);
      height:clamp(36px,3.6vw,52px);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(1.1rem,1.8vw,1.6rem);
      background:linear-gradient(145deg,#ffd755,var(--orange));
      border:2px solid rgba(18,16,12,.9);
      border-radius:50%;
      box-shadow:0 8px 18px rgba(0,0,0,.4);
    }
    .card-body{
      display:grid;
      grid-template-rows:auto 1fr auto;
      align-items:center;
      gap:clamp(9px,1vw,14px);
      padding:clamp(18px,1.6vw,24px) clamp(14px,1.35vw,22px) clamp(14px,1.35vw,22px);
    }
    .partner-card h3{
      font-family:'Barlow Condensed',Arial,sans-serif;
      font-size:clamp(1.8rem,2.8vw,3.55rem);
      line-height:.86;
      color:var(--gold);
      letter-spacing:.045em;
      text-transform:uppercase;
    }
    .partner-card p{
      align-self:start;
      font-size:clamp(.98rem,1.25vw,1.22rem);
      line-height:1.28;
      color:#e8dcc6;
      font-weight:700;
      max-width:420px;
      margin:0 auto;
    }
    .partner-action{
      width:100%;
      min-height:clamp(46px,4.7vh,62px);
      padding:.75rem 1rem;
      border:none;
      border-radius:999px;
      background:linear-gradient(90deg,#ffd755,var(--orange));
      color:#111;
      font-weight:900;
      font-size:clamp(.95rem,1.15vw,1.15rem);
      letter-spacing:.07em;
      text-transform:uppercase;
      cursor:pointer;
    }
    .partner-popup{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.94);
      z-index:20000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:clamp(12px,2vw,30px);
    }
    .partner-box{
      width:min(1040px,96vw);
      height:min(88dvh,900px);
      background:#111;
      border:3px solid var(--gold);
      border-radius:clamp(20px,2vw,28px);
      box-shadow:0 0 60px rgba(0,0,0,.82);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .partner-header{
      min-height:clamp(58px,7vh,76px);
      background:#15110b;
      border-bottom:1px solid rgba(217,182,93,.62);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:0 clamp(14px,1.8vw,24px);
    }
    .partner-header h3{
      font-family:'Barlow Condensed',Arial,sans-serif;
      font-size:clamp(1.65rem,3vw,2.7rem);
      line-height:.88;
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.05em;
      text-align:left;
    }
    .partner-header button{
      padding:11px 18px;
      background:var(--orange);
      color:#111;
      border:none;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.04em;
      white-space:nowrap;
    }
    .partner-content{
      flex:1;
      min-height:0;
      padding:clamp(20px,3vw,42px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(16px,2vw,24px);
    }
    .partner-content img{
      width:min(480px,86vw);
      height:clamp(150px,20vh,220px);
      object-fit:cover;
      border:1px solid rgba(217,182,93,.4);
      border-radius:22px;
    }
    .partner-content p{
      font-size:clamp(1.2rem,2.1vw,1.7rem);
      line-height:1.35;
      color:#e8dcc6;
      max-width:680px;
      font-weight:800;
      text-wrap:balance;
    }
    .open-site-btn{
      margin-top:4px;
      width:min(420px,100%);
      min-height:58px;
      padding:1rem 1.2rem;
      border:none;
      border-radius:999px;
      background:linear-gradient(90deg,#ffd755,var(--orange));
      color:#111;
      font-weight:900;
      font-size:clamp(1rem,1.4vw,1.25rem);
      letter-spacing:.06em;
      text-transform:uppercase;
      cursor:pointer;
    }
    #partnerFrame{
      display:none;
      width:100%;
      flex:1;
      min-height:0;
      border:0;
      background:#000;
    }

    @media (orientation:landscape) and (max-height:760px){
      :root{--safe:14px;--frame:14px;}
      .page{padding:18px 22px;gap:12px;}
      .brand h1{font-size:clamp(3.4rem,7vw,5.9rem);}
      .brand h2{font-size:clamp(1.2rem,2.2vw,2rem);}
      .hint{font-size:1.45rem;}
      .partner-card{padding:0;}
      .card-media{height:clamp(56px,10vh,96px);}
      .card-body{padding:10px 14px 12px;gap:6px;}
      .partner-card h3{font-size:clamp(1.55rem,2.4vw,2.45rem);}
      .partner-card p{font-size:.9rem;line-height:1.18;}
      .partner-action{min-height:42px;font-size:.85rem;padding:.55rem .8rem;}
    }

    @media (max-width:1080px){
      body{
        min-height:100dvh;
        overflow:auto;
        padding:14px;
      }
      .frame{inset:10px;border-width:3px;border-radius:28px;}
      .frame:after{inset:12px;border-radius:20px;}
      .page{
        height:auto;
        min-height:calc(100dvh - 28px);
        padding:22px 20px 24px;
        grid-template-rows:auto auto;
        gap:18px;
      }
      .topbar{
        grid-template-columns:1fr;
        gap:13px;
      }
      .back,.hint{
        width:100%;
        justify-self:stretch;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:50px;
      }
      .back{font-size:1rem;}
      .hint{font-size:clamp(1.45rem,5.5vw,2.1rem);white-space:normal;}
      .brand{order:-1;}
      .brand h1{
        font-size:clamp(4.6rem,18vw,7.5rem);
        line-height:.74;
      }
      .brand h2{
        font-size:clamp(1.45rem,5.2vw,2.2rem);
        line-height:.95;
      }
      .brand .line{width:86%;height:6px;}
      .partners-grid{
        grid-template-columns:1fr;
        grid-template-rows:none;
        height:auto;
        overflow:visible;
        gap:16px;
      }
      .partner-card{
        min-height:0;
        height:auto;
        padding:0;
      }
      .card-media{
        height:clamp(120px,32vw,180px);
      }
      .card-body{
        padding:16px 18px 18px;
        text-align:left;
      }
      .partner-card h3{
        font-size:clamp(2.15rem,8.2vw,3.55rem);
        text-align:left;
      }
      .partner-card p{
        max-width:none;
        font-size:clamp(1.02rem,4vw,1.25rem);
        line-height:1.25;
        margin:0;
        text-align:left;
      }
      .partner-action{
        min-height:48px;
        font-size:.98rem;
      }
      .partner-box{
        width:calc(100vw - 24px);
        height:calc(100dvh - 24px);
        border-radius:22px;
      }
      .partner-header{
        min-height:64px;
        padding:0 14px;
      }
      .partner-header h3{font-size:clamp(1.55rem,6vw,2.35rem);}
      .partner-content{padding:22px;}
      .partner-content img{width:clamp(142px,38vw,190px);}
      .partner-content p{font-size:clamp(1.15rem,4.6vw,1.45rem);}
    }

    @media (max-width:430px){
      body{padding:10px;}
      .page{min-height:calc(100dvh - 20px);padding:20px 16px 22px;gap:14px;}
      .brand h1{font-size:clamp(4rem,20vw,5.7rem);}
      .brand h2{font-size:clamp(1.25rem,5.5vw,1.8rem);}
      .partner-card{
        text-align:center;
        padding:0;
      }
      .card-body{
        text-align:center;
      }
      .partner-card h3,.partner-card p{text-align:center;}
      .partner-action{width:100%;}
      .partner-header button{padding:10px 14px;}
    }
  
/* SAFE IDLE VIDEO OVERLAY
   Videos are NOT loaded at page start. One lightweight video loads only after idle
   and is unloaded immediately when the screen is touched again. */
#safeIdleOverlay{
  position:fixed;
  inset:0;
  z-index:45000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:22px;
  padding:34px;
  background:rgba(10,8,5,.96);
  color:var(--cream,#f5ead8);
  text-align:center;
  pointer-events:auto;
}
#safeIdleOverlay .safe-idle-title{
  font-family:'Barlow Condensed',Arial,sans-serif;
  font-size:clamp(3rem,6vw,6rem);
  font-weight:700;
  letter-spacing:.06em;
  line-height:.82;
}
#safeIdleOverlay .safe-idle-msg{
  background:var(--orange,#ec7623);
  color:#111;
  border-radius:999px;
  padding:13px 26px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:clamp(1.05rem,2vw,1.7rem);
}
#safeIdleOverlay .safe-idle-video-frame{
  width:min(960px,82vw);
  height:min(540px,52vh);
  border:3px solid var(--gold,#d9b65d);
  border-radius:24px;
  overflow:hidden;
  background:#000;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#safeIdleOverlay video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
@media (orientation:portrait){
  #safeIdleOverlay{padding:18px;gap:16px;}
  #safeIdleOverlay .safe-idle-video-frame{width:min(92vw,720px);height:min(58vh,720px);}
}

  </style>
</head>
<body>
  <video id="ambientBgVideo" class="bg-video" muted loop playsinline preload="none" aria-hidden="true"></video>
  <div class="frame"></div>

  <main class="page">
    <div class="topbar">
      <button class="back" onclick="goBack()">‹ Back</button>
      <section class="brand" aria-label="Easy Times Things To Do">
        <h1>EASY TIMES</h1>
        <h2>Things To Do In Amsterdam</h2>
        <div class="line"></div>
      </section>
      <div class="hint">Tap • Scan • Explore</div>
    </div>

    <section class="partners-grid" id="partnersGrid" aria-label="Amsterdam tips and partners"></section>
  </main>


<div id="safeIdleOverlay" aria-hidden="true">
  <div class="safe-idle-title">EASY TIMES</div>
  <div class="safe-idle-msg">Tap the screen to continue</div>
  <div class="safe-idle-video-frame">
    <video id="safeIdleVideo" muted playsinline preload="none" disablepictureinpicture></video>
  </div>
</div>


  <div class="partner-popup" id="partnerPopup">
    <div class="partner-box">
      <div class="partner-header">
        <h3 id="popupTitle">Partner</h3>
        <button onclick="closePartnerPopup()">Close</button>
      </div>

      <div class="partner-content" id="partnerIntro">
        <img id="popupLogo" src="" alt="">
        <p id="popupText"></p>
        <button class="open-site-btn" onclick="openPartnerPage()">View Inside EasyTimes</button>
      </div>

      <iframe id="partnerFrame" src="about:blank" title="EasyTimes partner page"></iframe>
    </div>
  </div>

<script>
const partners = [
  {id:"abike",name:"A-Bike Rentals",icon:"🚲",logo:"images/abike.png",photo:"images/abike-photo.jpg",text:"Discover Amsterdam by bike. One of the best ways to explore the city.",page:"partner-abike.html"},
  {id:"hashmuseum",name:"Hash & Marijuana Museum",icon:"🌿",logo:"images/hash-museum.png",photo:"images/hash-museum-photo.jpg",text:"Learn about the fascinating history of cannabis culture.",page:"partner-hashmuseum.html"},
  {id:"canal",name:"Canal Cruise",icon:"🛶",logo:"images/canal-cruise.png",photo:"images/canal-cruise-photo.jpg",text:"Experience Amsterdam from the water with a classic canal cruise.",page:"partner-canal.html"},
  {id:"heineken",name:"Heineken Experience",icon:"🍺",logo:"images/heineken.png",photo:"images/heineken-photo.jpg",text:"Visit one of Amsterdam’s most famous attractions.",page:"partner-heineken.html"},
  {id:"rijksmuseum",name:"Rijksmuseum",icon:"🖼️",logo:"images/rijksmuseum.png",photo:"images/rijksmuseum-photo.jpg",text:"See masterpieces from Dutch history and art.",page:"partner-rijksmuseum.html"},
  {id:"annefrank",name:"Anne Frank House",icon:"📖",logo:"images/annefrank.png",photo:"images/annefrank-photo.jpg",text:"A powerful historical experience in Amsterdam.",page:"partner-annefrank.html"}
];

let activePartner = null;
const grid = document.getElementById("partnersGrid");

// Drop a matching photo file (e.g. images/canal-cruise-photo.jpg) into the images
// folder to show a real venue photo — falls back to the current artwork until then.
partners.forEach(partner => {
  const card = document.createElement("article");
  card.className = "partner-card";
  card.tabIndex = 0;
  card.innerHTML = `
    <div class="card-media">
      <img src="${partner.photo}" alt="${partner.name}" onerror="this.onerror=null;this.src='${partner.logo}';this.style.objectFit='contain';this.style.padding='14px';">
      <span class="card-icon">${partner.icon}</span>
    </div>
    <div class="card-body">
      <h3>${partner.name}</h3>
      <p>${partner.text}</p>
      <button class="partner-action" type="button">View Details</button>
    </div>
  `;
  card.addEventListener("click", () => openPartnerPopup(partner));
  card.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      openPartnerPopup(partner);
    }
  });
  grid.appendChild(card);
});

function goBack(){
  try{
    if(window.parent && window.parent !== window && typeof window.parent.closeThingsPopup === "function"){
      window.parent.closeThingsPopup();
      return;
    }
  }catch(e){}
  location.href = "index.html";
}

function openPartnerPopup(partner){
  activePartner = partner;
  document.getElementById("popupTitle").innerText = partner.icon + " " + partner.name;
  const popupLogo = document.getElementById("popupLogo");
  popupLogo.onerror = () => { popupLogo.onerror = null; popupLogo.src = partner.logo; popupLogo.style.objectFit = 'contain'; popupLogo.style.padding = '18px'; };
  popupLogo.style.objectFit = 'cover';
  popupLogo.style.padding = '0';
  popupLogo.src = partner.photo;
  popupLogo.alt = partner.name;
  document.getElementById("popupText").innerText = partner.text;
  document.getElementById("partnerIntro").style.display = "flex";
  document.getElementById("partnerFrame").style.display = "none";
  document.getElementById("partnerFrame").src = "about:blank";
  document.getElementById("partnerPopup").style.display = "flex";
}

function closePartnerPopup(){
  document.getElementById("partnerPopup").style.display = "none";
  document.getElementById("partnerFrame").src = "about:blank";
  activePartner = null;
}

function openPartnerPage(){
  if(!activePartner) return;
  document.getElementById("partnerIntro").style.display = "none";
  document.getElementById("partnerFrame").style.display = "block";
  document.getElementById("partnerFrame").src = activePartner.page;
}

/* =============================
   SAFE IDLE VIDEO PLAYER
   ============================= */
(function(){
  const IDLE_DELAY_MS = 45000;
  const idleVideoPairs = [
    { safe: 'idle-smoke-safe.mp4', original: 'smoke.mp4' },
    { safe: 'idle-mascotte-safe.mp4', original: 'mascotte.mp4' }
  ];

  const overlay = document.getElementById('safeIdleOverlay');
  const video = document.getElementById('safeIdleVideo');
  if (!overlay || !video) return;

  let timer = null;
  let currentIndex = 0;
  let visible = false;
  let fallbackActive = false;
  let lastMouseReset = 0;

  function unloadVideo(){
    try{
      video.pause();
      video.removeAttribute('src');
      video.load();
    }catch(e){}
  }

  function loadVideo(useOriginalFallback){
    if (!visible) return;
    const pair = idleVideoPairs[currentIndex];
    const src = useOriginalFallback ? pair.original : pair.safe;
    fallbackActive = !!useOriginalFallback;
    try{
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.src = src;
      video.load();
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    }catch(e){
      console.warn('Safe idle video skipped:', src, e);
    }
  }

  function nextVideo(){
    if (!visible) return;
    currentIndex = (currentIndex + 1) % idleVideoPairs.length;
    fallbackActive = false;
    loadVideo(false);
  }

  function canShowIdle(){
    const popup = document.querySelector('.partner-popup[style*="flex"], .iframe-popup[style*="flex"], .option-modal[style*="flex"], .sheet.open');
    if (popup) return false;
    const activeInput = document.activeElement;
    if (activeInput && ['INPUT','TEXTAREA','SELECT'].includes(activeInput.tagName)) return false;
    const audio = document.getElementById('player');
    if (audio && !audio.paused) return false;
    return true;
  }

  function showIdle(){
    if (!canShowIdle()) { resetIdle(); return; }
    visible = true;
    overlay.style.display = 'flex';
    overlay.setAttribute('aria-hidden','false');
    currentIndex = 0;
    fallbackActive = false;
    requestAnimationFrame(() => loadVideo(false));
  }

  function hideIdle(){
    visible = false;
    overlay.style.display = 'none';
    overlay.setAttribute('aria-hidden','true');
    unloadVideo();
  }

  function resetIdle(){
    clearTimeout(timer);
    hideIdle();
    timer = setTimeout(showIdle, IDLE_DELAY_MS);
  }

  video.addEventListener('ended', nextVideo);
  video.addEventListener('error', () => {
    if (!fallbackActive) { loadVideo(true); return; }
    nextVideo();
  });

  ['click','keydown','touchstart','pointerdown','wheel','input'].forEach(evt => {
    document.addEventListener(evt, resetIdle, {passive:true});
  });

  document.addEventListener('mousemove', () => {
    const now = Date.now();
    if (now - lastMouseReset > 1500) {
      lastMouseReset = now;
      resetIdle();
    }
  }, {passive:true});

  overlay.addEventListener('click', resetIdle, {passive:true});
  window.safeIdleReset = resetIdle;
  resetIdle();
})();

</script>
</body>
</html>
