<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Easy Times • Call Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#12100c;--gold:#d9b65d;--cream:#f5ead8;--orange:#ec7623;--muted:#b8ab94;
      --safe:clamp(14px,2.2vw,34px);--frame:clamp(12px,2.2vw,34px);--green:#3fae54;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:var(--bg);color:var(--cream);font-family:'Inter',Arial,sans-serif;touch-action:manipulation;}
    body{
      min-height:100dvh;padding:var(--safe);text-align:center;
      background:radial-gradient(circle at 75% 8%,rgba(217,182,93,.18),transparent 32%),
        radial-gradient(circle at 16% 90%,rgba(236,118,35,.16),transparent 34%),
        linear-gradient(112deg,#0c0b08 0%,#17120b 58%,#2b2112 100%);
    }
    .frame{position:fixed;inset:var(--frame);border:3px solid var(--gold);border-radius:clamp(22px,3vw,36px);pointer-events:none;z-index:5;box-shadow:inset 0 0 0 1px rgba(217,182,93,.16),0 0 54px rgba(0,0,0,.32);}
    .frame:after{content:"";position:absolute;inset:clamp(10px,1.4vw,18px);border:1px solid rgba(217,182,93,.18);border-radius:clamp(15px,2vw,25px);}
    .page{position:relative;z-index:2;min-height:calc(100dvh - (var(--safe) * 2));max-width:1200px;margin:0 auto;padding:clamp(18px,2.4vw,34px);display:flex;flex-direction:column;gap:clamp(14px,2vh,26px);}
    .topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(14px,2vw,28px);}
    .back{border:1px solid rgba(217,182,93,.62);background:rgba(245,234,216,.09);color:var(--cream);border-radius:999px;padding:clamp(12px,1.2vw,17px) clamp(18px,1.8vw,28px);font-size:clamp(.95rem,1.15vw,1.2rem);font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
    .back:hover,.back:focus{background:var(--orange);color:#111;border-color:var(--orange);outline:none;}
    .brand{text-align:center;}
    .brand h1{font-family:'Barlow Condensed',Arial,sans-serif;font-size:clamp(3.4rem,6vw,6.4rem);line-height:.8;letter-spacing:.05em;color:var(--cream);text-transform:uppercase;text-shadow:0 10px 28px rgba(0,0,0,.38);}
    .brand h2{font-family:'Barlow Condensed',Arial,sans-serif;font-size:clamp(1.3rem,2.2vw,2.1rem);line-height:.9;color:var(--gold);letter-spacing:.07em;text-transform:uppercase;margin-top:6px;}
    .spacer{width:1px;}

    .table-row{
      display:flex;align-items:center;justify-content:center;gap:.7em;flex-wrap:wrap;
      background:rgba(0,0,0,.28);border:1.4px solid rgba(217,182,93,.5);border-radius:16px;
      padding:.8em 1.1em;max-width:640px;margin:0 auto;width:100%;
    }
    .table-row label{font-weight:800;color:var(--gold);font-size:1rem;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
    .table-row input{flex:1;min-width:120px;background:rgba(245,234,216,.06);border:1.4px solid rgba(217,182,93,.5);border-radius:10px;color:var(--cream);font-size:1.05rem;padding:.6em .8em;}
    .table-row input:focus{outline:none;border-color:var(--orange);}
    .table-row.locked input{opacity:.85;}
    .table-row .locked-badge{display:none;font-size:.85rem;color:var(--muted);white-space:nowrap;}
    .table-row.locked .locked-badge{display:inline;}

    .request-grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,26px);
      max-width:1200px;margin:0 auto;width:100%;
    }
    .request-card{
      position:relative;border:2px solid rgba(217,182,93,.85);border-radius:26px;
      background:linear-gradient(145deg,rgba(18,16,12,.98),rgba(34,25,13,.98));
      padding:clamp(22px,3vw,34px);cursor:pointer;color:var(--cream);text-align:left;
      display:flex;flex-direction:column;gap:10px;transition:transform .16s ease,border-color .16s ease;font:inherit;
    }
    .request-card:hover,.request-card:focus{transform:translateY(-3px);border-color:var(--orange);outline:none;}
    .request-card:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .request-card .icon{font-size:clamp(2rem,3vw,2.8rem);}
    .request-card h3{font-family:'Barlow Condensed',Arial,sans-serif;font-size:clamp(1.6rem,2.3vw,2.4rem);letter-spacing:.03em;text-transform:uppercase;color:var(--gold);}
    .request-card p{font-size:clamp(.95rem,1.15vw,1.15rem);color:#e6dac4;font-weight:700;line-height:1.28;}
    .request-card.review-card{text-decoration:none;}

    #toast{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:560px;
      background:var(--green);border:4px solid #1f6e2f;color:#fff;padding:1.3em 1.6em;border-radius:24px;
      font-size:clamp(1.2rem,2vw,1.7rem);font-weight:900;text-align:center;display:none;opacity:0;
      transition:opacity .2s ease;z-index:10050;line-height:1.3;
    }
    #toast.show{display:block;opacity:1;}
    #toast.error{background:#c0392b;border-color:#7a231a;}

    @media (max-width:820px){
      .request-grid{grid-template-columns:1fr;}
      .topbar{grid-template-columns:1fr;gap:12px;}
      .back{justify-self:stretch;text-align:center;}
      .spacer{display:none;}
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <main class="page">
    <div class="topbar">
      <button class="back" onclick="location.href='index.html'">‹ Back</button>
      <section class="brand" aria-label="Easy Times Call Staff">
        <h1>Call Staff</h1>
        <h2>We're right here for you</h2>
      </section>
      <div class="spacer"></div>
    </div>

    <div class="table-row" id="tableRow">
      <label for="tableInput">📍 Table</label>
      <input id="tableInput" type="text" inputmode="text" maxlength="20" autocomplete="off" placeholder="e.g. 5 or Terrace 2"/>
      <span class="locked-badge">from QR code</span>
    </div>

    <section class="request-grid" aria-label="Staff requests">
      <button class="request-card" onclick="sendRequest('🔔 Call Staff', 'A customer needs help at the table.')">
        <div class="icon">🔔</div>
        <h3>Call Staff</h3>
        <p>General help — just ask us to come over.</p>
      </button>
      <button class="request-card" onclick="sendRequest('🔥 Ashtray / Lighter', 'A customer needs an ashtray or lighter.')">
        <div class="icon">🔥</div>
        <h3>Ashtray / Lighter</h3>
        <p>Need a fresh ashtray or a light.</p>
      </button>
      <a class="request-card review-card" href="https://www.google.com/search?q=easytimes+amsterdam+reviews" target="_blank" rel="noopener">
        <div class="icon">⭐</div>
        <h3>Leave A Review</h3>
        <p>Enjoying Easy Times? A Google review means a lot to our team.</p>
      </a>
    </section>
  </main>

  <div id="toast"></div>

<script>
/* Same Telegram bot/group as order-drinks.html — keeps staff alerts in one place. */
const botToken = "8854414326:AAEySBeH3YNCLG7027RZx1o8DON0I4ygvMM";
const chatId   = "-1004261215704";

let tableLabel = "";
function safeGet(key, fallback=""){ try{ const v = localStorage.getItem(key); return v===null?fallback:v; }catch(e){ return fallback; } }
function safeSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){} }

function initTableField(){
  const input = document.getElementById("tableInput");
  const row = document.getElementById("tableRow");
  const params = new URLSearchParams(location.search);
  const fromUrl = (params.get("table") || "").trim().slice(0, 20);

  if (fromUrl){
    tableLabel = fromUrl;
    input.value = fromUrl;
    input.readOnly = true;
    row.classList.add("locked");
    safeSet("lastTable", fromUrl);
  } else {
    tableLabel = safeGet("lastTable", "");
    input.value = tableLabel;
  }

  input.addEventListener("input", () => {
    tableLabel = input.value.trim().slice(0, 20);
    safeSet("lastTable", tableLabel);
  });
}
document.addEventListener("DOMContentLoaded", initTableField);

function showToast(msg, isError){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.toggle("error", !!isError);
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 3200);
}

// Prevents accidental double-taps from spamming staff with duplicate alerts.
const cooldowns = {};
async function sendRequest(label, detail){
  const now = Date.now();
  if (cooldowns[label] && now - cooldowns[label] < 15000){
    showToast("Already sent — staff has been notified.");
    return;
  }
  cooldowns[label] = now;

  const table = tableLabel ? `Table ${tableLabel}` : "Table not set";
  const text = `${label}\n${table}\n${detail}`;

  try{
    const resp = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chatId, text, disable_notification: false })
    });
    if (!resp.ok) throw new Error("Telegram request failed");
    showToast("✅ Staff has been notified!");
  }catch(e){
    showToast("⚠ Could not reach staff — please wave someone down.", true);
  }
}
</script>
</body>
</html>
